<svg xmlns="http://www.w3.org/2000/svg" width="80" height="360" viewBox="0 0 80 360">
  <defs>
    <linearGradient id="culm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8e48a"/>
      <stop offset="18%" stop-color="#c5dc6e"/>
      <stop offset="42%" stop-color="#7cb342"/>
      <stop offset="78%" stop-color="#3d7a28"/>
      <stop offset="100%" stop-color="#1e4a16"/>
    </linearGradient>
    <linearGradient id="culm2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8f0a8"/>
      <stop offset="22%" stop-color="#b5d46a"/>
      <stop offset="70%" stop-color="#4e8c30"/>
      <stop offset="100%" stop-color="#234d18"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a4a1c"/>
      <stop offset="45%" stop-color="#6b8f3a"/>
      <stop offset="55%" stop-color="#e8efc0"/>
      <stop offset="100%" stop-color="#2a4a1c"/>
    </linearGradient>
  </defs>

  <!-- internodes, slightly tapered -->
  <rect x="24" y="8" width="32" height="78" rx="15" fill="url(#culm)"/>
  <rect x="23" y="94" width="34" height="82" rx="15" fill="url(#culm2)"/>
  <rect x="22" y="184" width="36" height="86" rx="16" fill="url(#culm)"/>
  <rect x="21" y="278" width="38" height="74" rx="16" fill="url(#culm2)"/>

  <!-- specular strip -->
  <path d="M30 14 C32 48 31 86 30 90" fill="none" stroke="#f4f8d8" stroke-width="3.2" stroke-linecap="round" opacity="0.45"/>
  <path d="M29 100 C31 138 31 168 29 176" fill="none" stroke="#f4f8d8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M29 190 C31 228 31 258 29 268" fill="none" stroke="#f4f8d8" stroke-width="3.2" stroke-linecap="round" opacity="0.42"/>
  <path d="M29 284 C31 314 31 340 30 348" fill="none" stroke="#f4f8d8" stroke-width="3" stroke-linecap="round" opacity="0.38"/>

  <!-- vertical fibers -->
  <g fill="none" stroke="#2f5c1c" stroke-width="0.45" opacity="0.28">
    <path d="M38 16 L37 88"/>
    <path d="M46 18 L47 88"/>
    <path d="M38 100 L36 176"/>
    <path d="M47 102 L48 176"/>
    <path d="M37 190 L36 268"/>
    <path d="M48 192 L49 268"/>
    <path d="M37 284 L36 348"/>
    <path d="M48 286 L50 348"/>
  </g>

  <!-- nodes: sheath scar + ridge -->
  <ellipse cx="40" cy="90" rx="19" ry="7.5" fill="url(#node)"/>
  <ellipse cx="40" cy="90" rx="19" ry="7.5" fill="none" stroke="#1a3310" stroke-width="1.1"/>
  <path d="M22 90 Q40 84 58 90" fill="none" stroke="#eef3c8" stroke-width="1.1"/>

  <ellipse cx="40" cy="178" rx="20" ry="8" fill="url(#node)"/>
  <ellipse cx="40" cy="178" rx="20" ry="8" fill="none" stroke="#1a3310" stroke-width="1.1"/>
  <path d="M21 178 Q40 171 59 178" fill="none" stroke="#eef3c8" stroke-width="1.1"/>

  <ellipse cx="40" cy="272" rx="21" ry="8.2" fill="url(#node)"/>
  <ellipse cx="40" cy="272" rx="21" ry="8.2" fill="none" stroke="#1a3310" stroke-width="1.1"/>
  <path d="M20 272 Q40 265 60 272" fill="none" stroke="#eef3c8" stroke-width="1.1"/>

  <!-- small branch + two leaves at a node -->
  <path d="M58 176 C70 168 78 154 86 146" fill="none" stroke="#4a3318" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(72 150) rotate(-28)">
    <path d="M0 3 C8 -2 28 -8 46 -6 C58 -5 64 0 62 4 C50 10 24 12 8 9 C2 8 0 6 0 3Z" fill="#6aae38"/>
    <path d="M4 4 C22 0 42 0 58 3" fill="none" stroke="#2a5c1c" stroke-width="0.5"/>
  </g>
  <g transform="translate(78 142) rotate(-52)">
    <path d="M0 3 C6 -1 22 -7 38 -5 C48 -4 52 1 50 4 C40 9 18 10 6 7 C2 6 0 5 0 3Z" fill="#4c922c"/>
    <path d="M3 4 C16 0 32 0 46 3" fill="none" stroke="#1f4a16" stroke-width="0.45"/>
  </g>
</svg>
