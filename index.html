    <style>
        *, *::before, *::after {

        #control-deck {

        .deck-btn:active,

        /* ── UI Layer ── */
        #ui-layer {
            position: absolute; inset: 0;
            z-index: 2;
            pointer-events: none;
            padding: calc(10px + env(safe-area-inset-top, 0)) 12px 10px;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,.8);
        }
        #hud-top {
            display: flex;

        #hud-left { font-size: 1.1rem; line-height: 1.8; }
        #hud-left span { color: #7df9ff; font-weight: bold; }
        #energy-wrap {

        }
        #energy-label { font-size: .75rem; opacity: .8; }
        #energy-bar {
            width: 130px; height: 14px;
            background: rgba(255,255,255,.15);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.3);
        }
        #energy-fill {
            height: 100%;

            border-radius: 99px;
            transition: width .2s, background .4s;
        }

        #dragon-label {
            font-size: .75rem;
            opacity: .85;
            color: #ffd700;
            margin-top: 4px;
        }

        #dragon-bar {
            width: 130px;
            height: 12px;
            background: rgba(255,215,0,.12);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid rgba(255,215,0,.35);
            box-shadow: 0 0 10px rgba(255,215,0,.12);
        }

        #dragon-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #ff8c00, #ffd700, #fff4a3);
            border-radius: 99px;
            transition: width .2s;
            box-shadow: 0 0 12px rgba(255,215,0,.8);
        }

        #progress-wrap {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: min(400px, 80vw);
            text-align: center;
        }
        #progress-bar {
            width: 100%; height: 10px;
            background: rgba(255,255,255,.15);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.25);
            margin-top: 4px;
        }
        #progress-fill {
            height: 100%;
            background: linear-gradient(to right, #ffd700, #ff8c00);
            border-radius: 99px;
            transition: width .3s;
        }

        /* ── Overlay Screens（和風・刹那） ── */
        .overlay {
            position: fixed; inset: 0;
            z-index: 5;
            display: flex; align-items: center; justify-content: center;
            padding: calc(10px + env(safe-area-inset-top, 0)) 12px calc(10px + env(safe-area-inset-bottom, 0));
            background: rgba(0,0,0,.72);
            pointer-events: auto;
        }
        .overlay-title {
            align-items: stretch;
            justify-content: stretch;
            padding: 0;
            background:
                radial-gradient(ellipse at 72% 38%, rgba(255, 210, 120, .08) 0%, transparent 34%),
                linear-gradient(180deg, rgba(2, 8, 16, .22) 0%, rgba(0, 0, 0, .04) 38%, rgba(0, 4, 10, .55) 100%);
        }
        .setsuna {
            position: relative;
            flex: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .setsuna-flash {
            position: absolute;
            left: -10%;
            top: 38%;
            width: 120%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 228, 160, .0) 10%, rgba(255, 236, 190, .85) 48%, rgba(255, 180, 80, .35) 62%, transparent);
            transform: rotate(-18deg);
            box-shadow: 0 0 16px rgba(255, 210, 120, .45);
            pointer-events: none;
            animation: setsuna-slash 2.8s ease-in-out infinite;
        }
        @keyframes setsuna-slash {
            0%, 100% { opacity: .28; }
            46% { opacity: 1; }
            54% { opacity: .55; }
        }
        .setsuna-ink {
            position: absolute;
            left: -8%;
            bottom: 8%;
            width: 46%;
            height: 38%;
            background:
                radial-gradient(ellipse at 40% 60%, rgba(8, 4, 2, .42) 0%, transparent 68%),
                radial-gradient(ellipse at 70% 80%, rgba(90, 16, 12, .22) 0%, transparent 55%);
            pointer-events: none;
        }
        .setsuna-stamp {
            position: absolute;
            right: calc(18px + env(safe-area-inset-right, 0));
            bottom: calc(92px + env(safe-area-inset-bottom, 0));
            width: 42px;
            height: 42px;
            border: 2px solid #c4452f;
            color: #c4452f;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0;
            transform: rotate(-12deg);
            opacity: .82;
            pointer-events: none;
        }
        .setsuna-word {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top, 0));
            right: calc(16px + env(safe-area-inset-right, 0));
            writing-mode: vertical-rl;
            font-size: .7rem;
            letter-spacing: .55em;
            color: rgba(232, 196, 110, .72);
        }
        .setsuna-title {
            position: absolute;
            left: calc(18px + env(safe-area-inset-left, 0));
            top: 16%;
            writing-mode: vertical-rl;
            font-size: clamp(2.1rem, 11vw, 3.3rem);
            font-weight: 700;
            letter-spacing: .28em;
            line-height: 1;
            color: #f6e3a6;
            text-shadow: 0 2px 0 #2a1a08, 0 0 28px rgba(255, 200, 90, .28);
            margin: 0;
        }
        .setsuna-leap {
            position: absolute;
            right: 2%;
            top: 24%;
            width: min(248px, 68vw);
            height: auto;
            overflow: visible;
        }
        .setsuna-line {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(118px + env(safe-area-inset-bottom, 0));
            text-align: center;
            font-size: clamp(.95rem, 3.6vw, 1.15rem);
            letter-spacing: .42em;
            text-indent: .42em;
            color: #f0d78a;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,.7);
        }
        .setsuna-note {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(76px + env(safe-area-inset-bottom, 0));
            text-align: center;
            font-size: .68rem;
            letter-spacing: .18em;
            color: rgba(230, 220, 200, .7);
            margin: 0;
        }
        .setsuna .btn {
            position: absolute;
            left: 50%;
            bottom: calc(12px + env(safe-area-inset-bottom, 0));
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 4;
        }
        .setsuna .btn:hover { transform: translateX(-50%) scale(1.03); }
        .setsuna .btn:active,
        .setsuna .btn.is-pressed { transform: translateX(-50%) scale(0.92); }
        .setsuna-petal {
            position: absolute;
            width: 9px;
            height: 7px;
            background: radial-gradient(circle at 30% 30%, #ffd0de, #e8899a);
            border-radius: 70% 10% 70% 10%;
            opacity: .45;
            pointer-events: none;
            animation: setsuna-fall 7.5s linear infinite;
        }
        .setsuna-petal:nth-child(1) { left: 18%; animation-delay: -1s; animation-duration: 8.2s; }
        .setsuna-petal:nth-child(2) { left: 42%; animation-delay: -3.4s; animation-duration: 6.6s; }
        .setsuna-petal:nth-child(3) { left: 63%; animation-delay: -5.1s; animation-duration: 7.8s; }
        .setsuna-petal:nth-child(4) { left: 81%; animation-delay: -2.2s; animation-duration: 9s; }
        .setsuna-petal:nth-child(5) { left: 28%; animation-delay: -6s; animation-duration: 7.1s; }
        @keyframes setsuna-fall {
            0% { top: -8%; transform: rotate(0deg); opacity: 0; }
            12% { opacity: .5; }
            100% { top: 108%; transform: rotate(220deg); opacity: 0; }
        }
        @media (max-height: 700px) {
            .setsuna-title { font-size: 2rem; top: 12%; }

            .setsuna-stamp { bottom: calc(82px + env(safe-area-inset-bottom, 0)); width: 34px; height: 34px; font-size: .95rem; }

        @media (max-width: 380px) {

        }
        @media (prefers-reduced-motion: reduce) {
            .setsuna-petal, .setsuna-flash { animation: none; }
        }
        .card {
            position: relative;
            background:
                repeating-linear-gradient(90deg, rgba(255,236,200,.03) 0 1px, transparent 1px 7px),
                linear-gradient(165deg, #24343c 0%, #10181c 48%, #1a1210 100%);
            border: 1px solid #8a6a28;
            border-radius: 2px;

        .card h2 {
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;

            margin-bottom: .55rem;

        }
        .card p  { font-size: .88rem; line-height: 1.75; opacity: .92; margin-bottom: .35rem; color: #e8e0d0; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            min-width: 210px;
            background: linear-gradient(180deg, #c45c48, #8a2418);

        .btn:hover { transform: scale(1.03); filter: brightness(1.08); }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none !important;
        }
        #score-badge {
            display: inline-block;
            background: rgba(255,215,0,.12);
            border: 1px solid rgba(255,215,0,.3);
            border-radius: 10px;
            padding: 8px 20px;
            margin: 8px 0 4px;
            font-size: 1.1rem;
            color: #ffd700;
        }

        /* ── 跳ねボタン（操作盤・常時 48px以上） ── */
        #hane-btn {
            position: relative;
            z-index: 3;
            right: auto;
            bottom: auto;
            flex: 0 0 64px;
            width: 64px;
            height: 64px;
            min-width: 56px;
            min-height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(255,215,0,.55);
            background: radial-gradient(circle at 50% 35%, rgba(255,215,0,.30), rgba(0,40,60,.72));
            color: #ffe98a;
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
            font-size: 1.35rem;
            font-weight: bold;
            line-height: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
            box-shadow: 0 0 22px rgba(255,215,0,.35), inset 0 0 18px rgba(255,215,0,.15);

        }
        #hane-btn small { font-size: .45rem; opacity: .75; letter-spacing: .04em; }
        #hane-btn:active,
        #hane-btn.is-pressed { transform: scale(.92); }
        #hane-btn.cool {
            opacity: .38;

        }
        #hane-btn.free {
            border-color: #fff4a3;
            box-shadow: 0 0 32px rgba(255,215,0,.85), inset 0 0 22px rgba(255,215,0,.35);
        }

        /* ── Difficulty Badge ── */
        #diff-badge {
            position: absolute;
            z-index: 2;
            top: calc(52px + env(safe-area-inset-top, 0));
            left: 50%;
            transform: translateX(-50%);
            font-size: .8rem;
            padding: 4px 16px;
            border-radius: 99px;
            border: 1px solid currentColor;
            background: rgba(0,0,0,.35);
            backdrop-filter: blur(2px);
            pointer-events: none;
            transition: color .5s, border-color .5s;
            color: #7df9ff;
            text-shadow: 0 2px 6px rgba(0,0,0,.9);
        }
    </style>

/* ════════════════════════════════════════════════
   鯉の滝登り — スプライトシート対応（外部PNG / Base64 の両対応）
   ════════════════════════════════════════════════ */

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha: true, desynchronized: true }) || canvas.getContext('2d');
const FONT_JP = '"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif';

const ASSET_VERSION = '1';

/**
 * 完全1ファイル運用時: SPRITE_INLINE に data:image/png;base64,... を貼り付け。
 * 空のときは SPRITE_URL（images/koi-sprite-sheet.png）を読み込みます。
 */
const SPRITE_INLINE = '';
const SPRITE_URL    = 'images/koi-sprite-sheet.png?v=' + ASSET_VERSION;
const SPRITE = {
    img: new Image(),
    loaded: false,
    cols: 2,
    rows: 3,
    totalFrames: 6,
    frameW: 0,
    frameH: 0,
    fps: 8,
    drawW: 100,
    drawH: 180
};

function refreshSpriteDrawSize() {
    if (!SPRITE.loaded || !SPRITE.frameW || !SPRITE.frameH) return;
    const maxH = Math.min(H * 0.24, 200);
    const aspect = SPRITE.frameW / SPRITE.frameH;
    SPRITE.drawH = maxH;
    SPRITE.drawW = maxH * aspect;
}

SPRITE.img.onload = () => {
    if (!SPRITE.img.naturalWidth) {
        SPRITE.loaded = false;
        return;
    }
    SPRITE.loaded = true;
    SPRITE.frameW = SPRITE.img.naturalWidth / SPRITE.cols;
    SPRITE.frameH = SPRITE.img.naturalHeight / SPRITE.rows;
    refreshSpriteDrawSize();
    try { ctx.drawImage(SPRITE.img, 0, 0, 1, 1); } catch (e) {}
};
let spriteLoadWarningShown = false;
function showLoadWarning(msg) {
    const div = document.createElement('div');
    div.textContent = msg;
    div.style.cssText = [
        'position:fixed',
        'left:8px',
        'bottom:8px',
        'z-index:9999',
        'max-width:92vw',
        'color:#fff',
        'background:rgba(180,0,0,.85)',
        'padding:8px 12px',
        'border-radius:8px',
        'font-size:12px',
        'pointer-events:none',
        'box-shadow:0 2px 10px rgba(0,0,0,.4)'
    ].join(';');
    document.body.appendChild(div);
}
SPRITE.img.onerror = () => {
    SPRITE.loaded = false;
    const inlineOk = typeof SPRITE_INLINE === 'string' && SPRITE_INLINE.length > 80 && SPRITE_INLINE.indexOf('base64') !== -1;
    if (!inlineOk && !spriteLoadWarningShown) {
        spriteLoadWarningShown = true;
        showLoadWarning('スプライト画像が読み込めません（images のパスを確認）');
    }
};

if (typeof SPRITE_INLINE === 'string' && SPRITE_INLINE.length > 80 && SPRITE_INLINE.indexOf('base64') !== -1) {
    SPRITE.img.src = SPRITE_INLINE;
} else {
    SPRITE.img.src = SPRITE_URL;
}

/** iOS 古めの Safari 向け（roundRect 未対応時の白画面防止） */
function drawRoundRect(c, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    if (typeof c.roundRect === 'function') {
        c.beginPath();
        c.roundRect(x, y, w, h, rad);
        c.fill();
        return;
    }
    c.beginPath();
    c.moveTo(x + rad, y);
    c.lineTo(x + w - rad, y);
    c.quadraticCurveTo(x + w, y, x + w, y + rad);
    c.lineTo(x + w, y + h - rad);
    c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    c.lineTo(x + rad, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - rad);
    c.lineTo(x, y + rad);
    c.quadraticCurveTo(x, y, x + rad, y);
    c.fill();
}

/** 障害物「丸太」用 SVG。feTurbulence は初回ラスタライズで固まるので使わない */
const LOG_SVG_MARKUP = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100"><defs><linearGradient id="logBodyGradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#5d2e0a"/><stop offset="20%" stop-color="#8b4513"/><stop offset="50%" stop-color="#a0522d"/><stop offset="80%" stop-color="#8b4513"/><stop offset="100%" stop-color="#3e1f07"/></linearGradient><radialGradient id="ringsGradient" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f5deb3"/><stop offset="40%" stop-color="#d2b48c"/><stop offset="80%" stop-color="#8b4513"/><stop offset="100%" stop-color="#5d2e0a"/></radialGradient></defs><rect x="20" y="10" width="160" height="80" rx="5" fill="url(#logBodyGradient)"/><g opacity="0.3"><line x1="25" y1="30" x2="175" y2="30" stroke="#3e1f07" stroke-width="1"/><line x1="20" y1="50" x2="180" y2="50" stroke="#3e1f07" stroke-width="1"/><line x1="25" y1="70" x2="175" y2="70" stroke="#3e1f07" stroke-width="1"/></g><ellipse cx="180" cy="50" rx="15" ry="40" fill="url(#ringsGradient)" stroke="#5d2e0a" stroke-width="1"/><g stroke="#8b4513" fill="none" opacity="0.5" stroke-width="0.5"><ellipse cx="180" cy="50" rx="10" ry="28"/><ellipse cx="180" cy="50" rx="6" ry="18"/><ellipse cx="180" cy="50" rx="3" ry="8"/></g><path d="M 20 10 A 15 40 0 0 0 20 90" fill="none" stroke="#3e1f07" stroke-width="2"/></svg>`;
const LOG_IMG = new Image();
const LOG_BAKE = document.createElement('canvas');
LOG_BAKE.width = 200;
LOG_BAKE.height = 100;
let logImageReady = false;
let logBaked = false;
function bakeLogSprite() {
    if (logBaked || !logImageReady) return;
    const lx = LOG_BAKE.getContext('2d');
    lx.clearRect(0, 0, 200, 100);
    lx.drawImage(LOG_IMG, 0, 0, 200, 100);
    logBaked = true;
}
LOG_IMG.onload = () => {
    logImageReady = LOG_IMG.naturalWidth > 0;
    bakeLogSprite();
};
LOG_IMG.onerror = () => { logImageReady = false; };
LOG_IMG.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOG_SVG_MARKUP);

// ── DOM refs ──
const distUI       = document.getElementById('dist-ui');

const goScreen     = document.getElementById('gameover-screen');

// ── Game state ──
let STATE = 'START'; // START | PLAYING | GAMEOVER | VICTORY
let distance = 0;
let frame    = 0;

// ── Entities ──
let koi, obstacles, bubbles, particles, waterLines, decors;

function bindTap(el, handler) {
    if (!el) return;
    let locked = false;
    const fire = (e) => {
        if (locked) return;
        locked = true;
        if (e.cancelable) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
        try { if (e.pointerId != null) el.setPointerCapture(e.pointerId); } catch (err) {}
        el.classList.add('is-pressed');
        if (navigator.vibrate) navigator.vibrate(15);
        unlockWebAudio();
        handler(e);
        setTimeout(() => { locked = false; }, 280);
    };
    const release = () => el.classList.remove('is-pressed');
    el.addEventListener('pointerdown', fire);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('pointerleave', release);
    el.addEventListener('click', e => e.preventDefault());
}

bindTap(document.getElementById('start-btn'), startGame);
bindTap(document.getElementById('retry-btn'), startGame);
bindTap(document.getElementById('victory-btn'), startGame);
bindTap(haneBtn, doHane);
bindTap(document.getElementById('mute-btn'), toggleMute);

document.addEventListener('pointermove', e => {
    if (STATE === 'PLAYING') setTarget(e.clientX);
}, { passive: true });

// ── Canvas sizing ──
let W = 0, H = 0;
let DPR = 1;

function getSafeDPR() {
    const dpr = window.devicePixelRatio || 1;
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return isIOS ? Math.min(1.5, dpr) : Math.min(2, dpr);
}

function resize() {
    DPR = getSafeDPR();
    const wrap = document.getElementById('screen-wrap');
    const cssW = wrap && wrap.clientWidth > 0 ? wrap.clientWidth : window.innerWidth;

// ── Persistent data（破損・NaN対策／旧キー koiking_best からの移行対応）
function sanitizeBestStored(raw) {
    if (raw == null || raw === '') return null;
    const n = Number(String(raw).trim());
    if (!Number.isFinite(n) || n < 0) return null;
    return Math.min(999999, Math.floor(n));
}
function loadBestDistance() {
    const a = sanitizeBestStored(localStorage.getItem('koi_best'));
    const b = sanitizeBestStored(localStorage.getItem('koiking_best'));
    const v = Math.max(a != null ? a : 0, b != null ? b : 0);
    try {
        localStorage.setItem('koi_best', String(v));
        localStorage.removeItem('koiking_best');
    } catch (e) {}
    return v;
}
function persistBestDistance(n) {
    const stored = sanitizeBestStored(String(n));
    const v = stored !== null ? stored : 0;
    bestDistance = v;
    try { localStorage.setItem('koi_best', String(v)); } catch (e) {}
    bestUI.textContent = String(v);
}

    }

const LAYER_BAND = 100 / LAYERS.length;   // = CFG.MAX_DIST / 4

function layerIndexAt(d) {
    const i = Math.floor(d / LAYER_BAND);
    return Math.max(0, Math.min(LAYERS.length - 1, i));
}
function currentLayer() { return LAYERS[layerIndexAt(distance)]; }

function obstacleMinGap() {
    return Math.max(300, H * 0.48);
}
function spawnObstacleX() {
    const avoid = koi ? koi.x : W / 2;
    const clear = Math.max(88, W * 0.22);
    let x = 50 + Math.random() * (W - 100);
    let guard = 0;
    while (guard++ < 10 && Math.abs(x - avoid) < clear) {
        x = 50 + Math.random() * (W - 100);
    }
    return x;
}
function nextSpawnY(except) {
    const gap = obstacleMinGap();
    let y = -(gap * 0.7 + Math.random() * gap * 0.35);
    const others = (obstacles || []).filter(o => o && o !== except);
    let guard = 0;
    while (guard++ < 16 && others.some(o => Math.abs(o.y - y) < gap)) {
        y -= gap;
    }
    return y;
}

// 層の終盤で次層の色へなめらかに遷移させるための係数
function layerBlend() {
    const i = layerIndexAt(distance);
    if (i >= LAYERS.length - 1) return { i, next: i, f: 0 };
    const local = (distance - i * LAYER_BAND) / LAYER_BAND;
    const START = 0.80;
    if (local < START) return { i, next: i + 1, f: 0 };
    const t = (local - START) / (1 - START);
    return { i, next: i + 1, f: t * t * (3 - 2 * t) };
}

function hex2rgb(h) {
    return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function mixHex(a, b, t) {
    const A = hex2rgb(a), B = hex2rgb(b);
    return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;
}

function unlockWebAudio() {
    try {
        const ac = getAudio();
        if (ac.state === 'suspended') void ac.resume();
        if (!audioUnlockTried) {
            audioUnlockTried = true;
            const buf = ac.createBuffer(1, 1, 22050);
            const src = ac.createBufferSource();
            src.buffer = buf;
            src.connect(ac.destination);

        }

    } catch (e) {}

}

function playTone(freq, type, duration, vol = 0.15, detune = 0) {
    try {
        if (muted) return;
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') return;

        const ac  = getAudio();
        const osc = ac.createOscillator();
        const gain= ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.type = type; osc.frequency.value = freq;
        osc.detune.value = detune;
        gain.gain.setValueAtTime(vol, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
        osc.start(); osc.stop(ac.currentTime + duration);
    } catch(e) {}
}

/* ════════════════════════════════
   PARTICLE SYSTEM
   ════════════════════════════════ */
class Particle {
    constructor(x, y, opts = {}) {
        this.x  = x; this.y = y;
        this.vx = opts.vx !== undefined ? opts.vx : (Math.random()-0.5)*6;
        this.vy = opts.vy !== undefined ? opts.vy : (Math.random()-0.5)*6;
        this.life    = 1.0;
        this.decay   = opts.decay !== undefined ? opts.decay : 0.025;
        this.r       = opts.r !== undefined ? opts.r : 3;
        this.color   = opts.color !== undefined ? opts.color : '#7df9ff';
        this.gravity = opts.gravity !== undefined ? opts.gravity : 0.06;
        this.glow    = opts.glow !== undefined ? opts.glow : false;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.98;
        this.life -= this.decay;
    }
    draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        const r = this.r * this.life;
        if (this.glow) {
            ctx.globalAlpha = Math.max(0, this.life) * 0.28;
            ctx.beginPath();
            ctx.arc(this.x, this.y, r * 2.1, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
    get dead() { return this.life <= 0; }
}

function spawnBurst(x, y, count, opts) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, opts));
}

/* ════════════════════════════════
   KOI CLASS（スプライト / 手描きフォールバック）
   ════════════════════════════════ */
class Koi {
    constructor() {
        this.x          = W / 2;
        this.y          = H * 0.78;
        this.targetX    = this.x;
        this.energy     = 100;
        this.swing      = 0;
        this.swingSpd   = 0.18;
        this.radius     = 16;
        this.trail      = [];
        this.tilt       = 0;
        this.frameIndex = 0;
        this.frameTimer = 0;
        this.frameInterval = Math.max(1, Math.round(60 / SPRITE.fps));

        this.dragonKi = 0;
        this.dragonMode = false;
        this.dragonTimer = 0;

        // ② 跳ね（水面蹴り）
        this.haneTimer = 0;
        this.haneCd    = 0;
        this.haneCombo = 0;
    }

    // 跳ね中の前半は無敵、龍モード中も無敵
    get invincible() {
        return this.dragonMode || this.haneTimer > (CFG.HANE_DUR - CFG.HANE_INV);
    }

    tryHane() {
        if (STATE !== 'PLAYING') return false;
        if (this.haneTimer > 0 || this.haneCd > 0) return false;

        const free = this.dragonMode;
        if (!free && this.energy < CFG.HANE_COST + 2) { sfxHaneFail(); return false; }
        if (!free) this.energy -= CFG.HANE_COST;

        this.haneTimer = free ? CFG.HANE_DUR + 10 : CFG.HANE_DUR;
        this.haneCd    = free ? Math.round(CFG.HANE_CD * 0.55) : CFG.HANE_CD;
        this.haneCombo = 0;
        sfxHane();

        // 水しぶき
        for (let i = 0; i < 16; i++) {
            particles.push(new Particle(this.x + (Math.random()-0.5)*30, this.y + 18, {
                vx: (Math.random()-0.5)*5,
                vy: 1.2 + Math.random()*3,
                r: 2 + Math.random()*2.5,
                decay: 0.045,
                color: Math.random() > 0.4 ? 'rgba(220,250,255,0.9)' : 'rgba(125,249,255,0.8)',
                glow: true, gravity: 0.12
            }));
        }
        return true;
    }

    syncHitRadius() {
        this.radius = SPRITE.loaded
            ? Math.min(SPRITE.drawW, SPRITE.drawH) * 0.22
            : 16;
    }

    getSpriteRect(idx) {
        const col = idx % SPRITE.cols;
        const row = Math.floor(idx / SPRITE.cols);
        return {
            sx: col * SPRITE.frameW,
            sy: row * SPRITE.frameH,
            sw: SPRITE.frameW,
            sh: SPRITE.frameH
        };
    }

    update() {
        // ── ② 跳ね処理 ──
        if (this.haneCd > 0) this.haneCd--;
        let lift = 0;
        if (this.haneTimer > 0) {
            this.haneTimer--;
            const p = Math.min(1, this.haneTimer / CFG.HANE_DUR);   // 1 → 0
            lift = Math.sin(p * Math.PI) * H * CFG.HANE_LIFT;
            distance += CFG.HANE_BOOST;

            if (frame % 2 === 0) {
                particles.push(new Particle(
                    this.x + (Math.random()-0.5) * 26,
                    this.y + 26 + Math.random() * 18,
                    {
                        vx: (Math.random()-0.5)*1.6,
                        vy: 2.5 + Math.random()*2,
                        r: 2 + Math.random()*2,
                        decay: 0.05,
                        color: this.invincible ? 'rgba(255,255,220,0.85)' : 'rgba(180,240,255,0.7)',
                        glow: true, gravity: 0.05
                    }
                ));
            }
        }
        const baseY = H * 0.78;
        this.y += ((baseY - lift) - this.y) * 0.25;

        this.x += (this.targetX - this.x) * CFG.KOI_LERP;
        const margin = SPRITE.loaded ? SPRITE.drawW / 2 + 10 : 22;
        this.x = Math.max(margin, Math.min(W - margin, this.x));
        this.swing += this.swingSpd;

        const targetTiltSprite = (this.targetX - this.x) * 0.012;
        this.tilt += (targetTiltSprite - this.tilt) * 0.12;

        this.trail.unshift({ x: this.x, y: this.y });
        if (this.trail.length > (SPRITE.loaded ? 4 : 3)) this.trail.pop();

        if (SPRITE.loaded) {
            this.frameTimer++;
            if (this.frameTimer >= this.frameInterval) {
                this.frameTimer = 0;
                this.frameIndex = (this.frameIndex + 1) % SPRITE.totalFrames;
            }
            if (frame % 12 === 0) {
                particles.push(new Particle(
                    this.x + (Math.random() - 0.5) * 20,
                    this.y + SPRITE.drawH * 0.35,
                    {
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: 0.5 + Math.random(),
                        r: 2,
                        decay: 0.04,
                        color: 'rgba(125,249,255,0.5)',
                        gravity: 0.01
                    }
                ));
            }
        } else if (frame % 10 === 0) {
            particles.push(new Particle(this.x, this.y + 25, {
                vx: (Math.random() - 0.5) * 1.2,
                vy: 0.8 + Math.random() * 0.8,
                r: 2.5,
                decay: 0.035,
                color: 'rgba(125,249,255,0.5)',
                gravity: 0.01
            }));
        }

        this.syncHitRadius();

        if (!this.dragonMode && this.dragonKi >= 25 && frame % 5 === 0) {
            particles.push(new Particle(
                this.x + (Math.random() - 0.5) * 45,
                this.y + (Math.random() - 0.5) * 70,
                {
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2,
                    r: 1.2 + Math.random() * 2,
                    decay: 0.04,
                    color: Math.random() > 0.5 ? 'rgba(255,215,0,0.85)' : 'rgba(255,200,100,0.6)',
                    glow: true,
                    gravity: -0.02
                }
            ));
        }

        if (!this.dragonMode && this.dragonKi >= 75 && frame % 200 === 0 && Math.random() < 0.55) {
            dragonShadowTimer = 22;
        }

        if (this.dragonMode) {
            this.dragonTimer--;

            this.energy -= CFG.ENERGY_DRAIN * 0.25;

            if (frame % 2 === 0) {
                particles.push(new Particle(
                    this.x + (Math.random() - 0.5) * 35,
                    this.y + (Math.random() - 0.5) * 60,
                    {
                        vx: (Math.random() - 0.5) * 2.5,
                        vy: 0.5 + Math.random() * 1.5,
                        r: 2.5 + Math.random() * 3,
                        decay: 0.025,
                        color: Math.random() > 0.5 ? '#ffd700' : '#ff8c00',
                        glow: true,
                        gravity: -0.01
                    }
                ));
            }

            if (this.dragonTimer <= 0) {
                this.dragonMode = false;
                this.dragonTimer = 0;
                this.dragonKi = 0;

                dragonText = '龍気収束';
                dragonTextTimer = 45;
            }

            updateDragonHUD();

        } else {
            this.energy -= CFG.ENERGY_DRAIN;
        }

        if (this.energy <= 0) {
            this.energy = 0;
            endGame(false);
        }

        const pct = this.energy;
        energyFill.style.width = pct + '%';
        energyFill.style.background = pct > 50
            ? 'linear-gradient(to right,#00b4d8,#90e0ef)'
            : pct > 25
                ? 'linear-gradient(to right,#ffd700,#ffa500)'
                : 'linear-gradient(to right,#ff4444,#ff0000)';
    }

    drawProceduralKoi() {
        ctx.translate(this.x, this.y);
        ctx.rotate(this.tilt);
        const sway = Math.sin(this.swing);

        const body = ctx.createLinearGradient(0, -48, 0, 26);
        body.addColorStop(0, '#fffaf3');
        body.addColorStop(1, '#d4c4ae');
        ctx.fillStyle = body;
        ctx.strokeStyle = '#3a2418';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(0, -48);
        ctx.lineTo(3.2, -38);
        ctx.lineTo(6.2, -22);
        ctx.bezierCurveTo(10, -6, 8.5, 10, 2.6, 26);
        ctx.lineTo(-2.6, 26);
        ctx.bezierCurveTo(-8.5, 10, -10, -6, -6.2, -22);
        ctx.lineTo(-3.2, -38);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#d31e16';
        ctx.beginPath();
        ctx.ellipse(0, 2, 4.4, 7, 0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-2, 14, 3.2, 4.5, -0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a1410';
        ctx.beginPath();
        ctx.ellipse(3.5, 18, 2.2, 2.8, 0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#efe2d0';
        ctx.beginPath();
        ctx.moveTo(11, 2);
        ctx.quadraticCurveTo(24, 10 + sway * 2, 12, 16);
        ctx.quadraticCurveTo(7, 8, 11, 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-11, 2);
        ctx.quadraticCurveTo(-24, 10 - sway * 2, -12, 16);
        ctx.quadraticCurveTo(-7, 8, -11, 2);
        ctx.fill();

        const ts = sway * 10;
        const tail = ctx.createLinearGradient(0, 26, ts, 52);
        if (!this.dragonMode && this.dragonKi >= 50) {
            tail.addColorStop(0, '#ffd700');
            tail.addColorStop(1, 'rgba(255,140,0,0.35)');
        } else {
            tail.addColorStop(0, '#d31e16');
            tail.addColorStop(1, 'rgba(122,16,12,0.35)');
        }
        ctx.fillStyle = tail;
        ctx.beginPath();
        ctx.moveTo(-3, 26);
        ctx.quadraticCurveTo(-16 + ts, 36, -14 + ts, 50);
        ctx.lineTo(ts * 0.4, 40);
        ctx.lineTo(14 + ts, 50);
        ctx.quadraticCurveTo(16 + ts, 36, 3, 26);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#2c1812';
        ctx.lineWidth = 1.05;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-3, -44);
        ctx.quadraticCurveTo(-14, -34, -16, -20);
        ctx.moveTo(3, -44);
        ctx.quadraticCurveTo(14, -34, 16, -20);
        ctx.stroke();

        ctx.fillStyle = '#14110f';
        ctx.beginPath();
        ctx.arc(-3.6, -30, 1.55, 0, Math.PI * 2);
        ctx.arc(3.6, -30, 1.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-3.1, -30.6, 0.5, 0, Math.PI * 2);
        ctx.arc(4.1, -30.6, 0.5, 0, Math.PI * 2);
        ctx.fill();
    }

    draw() {
        if (SPRITE.loaded) {
            this.trail.forEach((p, i) => {
                const alpha = (1 - i / this.trail.length) * 0.08;
                if (alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(p.x, p.y);
                ctx.rotate(this.tilt);
                const rect = this.getSpriteRect(this.frameIndex);
                const hw = SPRITE.drawW / 2;
                const hh = SPRITE.drawH / 2;
                ctx.drawImage(
                    SPRITE.img,
                    rect.sx, rect.sy, rect.sw, rect.sh,
                    -hw, -hh, SPRITE.drawW, SPRITE.drawH
                );
                ctx.restore();
            });
        } else {
            this.trail.forEach((p, i) => {
                const a = (1 - i / this.trail.length) * 0.14;
                ctx.save();
                ctx.globalAlpha = a;
                ctx.fillStyle = '#d4c4ae';
                ctx.translate(p.x, p.y);
                ctx.rotate(this.tilt);
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.bezierCurveTo(4, -6, 5, 2, 2, 8);
                ctx.lineTo(-2, 8);
                ctx.bezierCurveTo(-5, 2, -4, -6, 0, -10);
                ctx.fill();
                ctx.restore();
            });
        }

        // 跳ね無敵中のリング
        if (!this.dragonMode && this.haneTimer > 0) {
            const p = this.haneTimer / CFG.HANE_DUR;
            const rr = (SPRITE.loaded ? Math.max(SPRITE.drawW, SPRITE.drawH) * 0.42 : 48) * (1.25 - p * 0.25);
            ctx.save();
            ctx.globalAlpha = Math.min(0.75, p * 0.9);
            ctx.strokeStyle = this.invincible ? 'rgba(255,255,210,0.95)' : 'rgba(160,230,255,0.7)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(this.x, this.y, rr, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        ctx.save();
        if (this.dragonMode) {
            const pulse = 0.75 + Math.sin(frame * 0.25) * 0.25;

            ctx.save();
            ctx.translate(this.x, this.y);

            const auraR = SPRITE.loaded
                ? Math.max(SPRITE.drawW, SPRITE.drawH) * 0.45
                : 55;

            const aura = ctx.createRadialGradient(0, 0, 0, 0, 0, auraR);
            aura.addColorStop(0, `rgba(255,255,180,${0.35 * pulse})`);
            aura.addColorStop(0.45, `rgba(255,215,0,${0.25 * pulse})`);
            aura.addColorStop(1, 'rgba(255,140,0,0)');

            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(0, 0, auraR, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(255,215,0,${0.7 * pulse})`;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ffd700';
            ctx.beginPath();
            ctx.arc(0, 0, auraR * 0.55, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }
        if (SPRITE.loaded) {
            ctx.translate(this.x, this.y);
            ctx.rotate(this.tilt);
            const rect = this.getSpriteRect(this.frameIndex);
            const hw = SPRITE.drawW / 2;
            const hh = SPRITE.drawH / 2;
            ctx.drawImage(
                SPRITE.img,
                rect.sx, rect.sy, rect.sw, rect.sh,
                -hw, -hh, SPRITE.drawW, SPRITE.drawH
            );
        } else {
            this.drawProceduralKoi();
        }
        ctx.restore();
    }
}

/* ════════════════════════════════
   OBSTACLE CLASS
   ════════════════════════════════ */
class Obstacle {
    constructor(forceY = null) {
        this.init(forceY);
    }
    init(forceY = null) {
        this.x    = spawnObstacleX();
        this.y    = forceY !== null ? forceY : nextSpawnY(this);
        this.size = 14 + Math.random() * 22;
        this.rot  = Math.random() * Math.PI * 2;
        this.rotSpd = (Math.random()-0.5) * 0.035;

        // Type — 層ごとの出現テーブルに従う
        const w = currentLayer().weights;
        const r = Math.random();
        if      (r < w.rock)          { this.type = 'rock'; }
        else if (r < w.rock + w.log)  { this.type = 'log';  }
        else                          { this.type = 'whirl'; }

        const p = Math.random();
        if      (p < 0.5)  { this.pattern = 'straight'; }
        else if (p < 0.8)  { this.pattern = 'sine'; this.phase = Math.random()*Math.PI*2; this.amp = 16+Math.random()*28; }
        else               { this.pattern = 'zigzag'; this.dir = Math.random()>0.5?1:-1; this.timer = 0; }

        this.baseX = this.x;
        this.nearMissReady = true;
    }
    nearMisses(koi) {
        const dx = koi.x - this.x;
        const dy = koi.y - this.y;
        const rx = (this.type === 'log') ? this.size       : this.size * 0.8;
        const ry = (this.type === 'log') ? this.size * 0.45 : this.size * 0.8;
        const koiR = koi.radius * 0.85;
        const inner = (dx * dx) / ((rx + koiR) * (rx + koiR)) + (dy * dy) / ((ry + koiR) * (ry + koiR));
        if (inner < 1) return false;
        const stretch = 1.38;
        const outer = (dx * dx) / ((rx * stretch + koiR) * (rx * stretch + koiR))
            + (dy * dy) / ((ry * stretch + koiR) * (ry * stretch + koiR));
        return outer < 1;
    }
    update() {
        const spd = CFG.speed;
        this.y   += spd;
        this.rot += this.rotSpd;

        if (this.pattern === 'sine') {
            this.phase += 0.02;
            this.x = this.baseX + Math.sin(this.phase) * this.amp;
        } else if (this.pattern === 'zigzag') {
            this.timer++;
            if (this.timer > 35 + Math.random()*25) { this.dir *= -1; this.timer = 0; }
            this.x += this.dir * 2;
            if (this.x < this.size) { this.x = this.size; this.dir = 1; }
            if (this.x > W-this.size) { this.x = W-this.size; this.dir = -1; }
        }

        if (this.y > H + 60) this.init();
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);

        if (this.type === 'rock') {
            const g = ctx.createRadialGradient(-this.size*.25, -this.size*.25, 0, 0, 0, this.size);
            g.addColorStop(0, '#777'); g.addColorStop(1, '#222');
            ctx.fillStyle = g;
            ctx.beginPath();
            const pts = 6;
            for (let i = 0; i < pts; i++) {
                const a = (i/pts)*Math.PI*2;
                const r = this.size * (0.8 + Math.sin(i*2)*0.2);
                i===0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r)
                      : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
            }
            ctx.closePath(); ctx.fill();

        } else if (this.type === 'log') {
            if (logBaked) {
                ctx.drawImage(LOG_BAKE, -this.size, -this.size * 0.5, this.size * 2, this.size);
            } else if (logImageReady && LOG_IMG.complete && LOG_IMG.naturalWidth) {
                bakeLogSprite();
                ctx.drawImage(logBaked ? LOG_BAKE : LOG_IMG, -this.size, -this.size * 0.5, this.size * 2, this.size);
            } else {
                const lg = ctx.createLinearGradient(0,-this.size*.2,0,this.size*.2);
                lg.addColorStop(0,'#6d4c2a'); lg.addColorStop(1,'#2d1a0a');
                ctx.fillStyle = lg;
                drawRoundRect(ctx, -this.size, -this.size*.25, this.size*2, this.size*.5, 4);
                ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1;
                [-this.size*.4, 0, this.size*.4].forEach(bx => {
                    ctx.beginPath(); ctx.arc(bx, 0, this.size*.15, 0, Math.PI*2); ctx.stroke();
                });
            }

        } else { // whirl
            for (let i = 3; i > 0; i--) {
                ctx.strokeStyle = `rgba(0,180,255,${0.12*i})`;
                ctx.lineWidth   = i * 3;
                ctx.beginPath();
                ctx.arc(0, 0, this.size * (0.3 + i*.15), 0, Math.PI*2);
                ctx.stroke();
            }
            ctx.fillStyle = 'rgba(0,160,255,0.2)';
            ctx.beginPath(); ctx.arc(0,0,this.size*.3,0,Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }

    /* Enhanced ellipse collision detection */
    collidesWith(koi) {
        const dx = koi.x - this.x;
        const dy = koi.y - this.y;
        const rx = (this.type === 'log') ? this.size       : this.size * 0.8;
        const ry = (this.type === 'log') ? this.size * 0.45 : this.size * 0.8;
        const koiR = koi.radius * 0.85; // Slightly forgiving
        return (dx*dx)/((rx+koiR)*(rx+koiR)) + (dy*dy)/((ry+koiR)*(ry+koiR)) < 1;
    }
}

/* ════════════════════════════════
   BUBBLE CLASS
   ════════════════════════════════ */
class Bubble {
    constructor() { this.reset(); }
    reset() {
        this.x    = 35 + Math.random() * (W - 70);
        this.y    = -(15 + Math.random() * 120);
        this.r    = 7 + Math.random() * 10;
        this.phase= Math.random() * Math.PI * 2;
        this.glow = Math.random() > 0.7; // golden bubble
        this.color= this.glow ? '#ffd700' : '#7df9ff';
        this.energy = this.glow ? CFG.BUBBLE_ENERGY * 1.5 : CFG.BUBBLE_ENERGY;
    }
    update() {
        this.y     += CFG.speed * 0.8;
        this.phase += 0.025;
        this.x     += Math.sin(this.phase) * 0.6;
        if (this.y > H + 25) this.reset();
    }
    draw() {
        ctx.save();
        ctx.strokeStyle = this.color;
        ctx.lineWidth   = 1.8;
        ctx.globalAlpha = this.glow ? 0.95 : 0.85;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.stroke();

        ctx.globalAlpha = 1;
        ctx.fillStyle = this.glow
            ? 'rgba(255,215,0,0.16)'
            : 'rgba(125,249,255,0.10)';
        ctx.fill();
        if (this.glow) {
            ctx.fillStyle = 'rgba(255,215,0,0.12)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r * 1.7, 0, Math.PI*2);
            ctx.fill();
        }

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(this.x - this.r*.3, this.y - this.r*.3, this.r*.25, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
    collidesWith(koi) {
        return Math.hypot(koi.x - this.x, koi.y - this.y) < koi.radius + this.r;
    }
}

/* ════════════════════════════════

class WaterLine {

        this.speed = 5 + Math.random() * 5;
        this.len   = 25 + Math.random() * 60;

        this.y += this.speed;

        ctx.strokeStyle = '#aee8f5';
        ctx.lineWidth   = this.width;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);

        ctx.stroke();

}

/* ════════════════════════════════
   ① 層ごとの舞い散る意匠（桜／笹／紅葉／火の粉）
   ════════════════════════════════ */
class Decor {
    constructor() { this.reset(true); }
    reset(init) {
        this.x       = Math.random() * W;
        this.y       = init ? Math.random() * H : -25 - Math.random() * 90;
        this.size    = 7 + Math.random() * 10;
        this.spd     = 0.8 + Math.random() * 1.8;
        this.sway    = Math.random() * Math.PI * 2;
        this.swaySpd = 0.015 + Math.random() * 0.03;
        this.rot     = Math.random() * Math.PI * 2;
        this.rotSpd  = (Math.random() - 0.5) * 0.05;
        this.alpha   = 0.28 + Math.random() * 0.5;
        this.gold    = Math.random() < 0.42;
        this.flip    = Math.random() < 0.5;
    }
    update() {
        this.sway += this.swaySpd;
        this.y    += this.spd + CFG.speed * 0.22;
        this.x    += Math.sin(this.sway) * 0.9;
        this.rot  += this.rotSpd;
        if (this.y > H + 40) this.reset(false);
    }
    draw(L) {
        const rgb = L.decorColor;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.fillStyle = `rgba(${rgb},0.9)`;

        if (L.decor === 'petal') {
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size * 0.55, this.size, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (L.decor === 'leaf') {
            if (this.flip) ctx.scale(-1, 1);
            const ok = window.KoiPlants && KoiPlants.drawSasa(ctx, this.size);
            if (!ok) {
                ctx.beginPath();
                ctx.moveTo(-this.size * 1.4, 0);
                ctx.quadraticCurveTo(0, -this.size * 0.55, this.size * 1.4, 0);
                ctx.quadraticCurveTo(0, this.size * 0.55, -this.size * 1.4, 0);
                ctx.fill();
            }
        } else if (L.decor === 'momiji') {
            const ok = window.KoiPlants && KoiPlants.drawMomiji(ctx, this.size, this.gold);
            if (!ok) {
                for (let i = 0; i < 5; i++) {
                    const a = -Math.PI / 2 + (i / 5) * Math.PI * 1.55 - Math.PI * 0.28;
                    ctx.save();
                    ctx.rotate(a);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(this.size * 0.42, -this.size * 0.45, 0, -this.size);
                    ctx.quadraticCurveTo(-this.size * 0.42, -this.size * 0.45, 0, 0);
                    ctx.fill();
                    ctx.restore();
                }
            }
        } else { // spark
            ctx.shadowBlur  = 12;
            ctx.shadowColor = `rgba(${rgb},0.9)`;
            ctx.beginPath();
            ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

/* ════════════════════════════════
   DRAGON VICTORY ANIMATION
   ════════════════════════════════ */
let victoryT = 0;
let dragonFlash = 0;
let dragonTextTimer = 0;
let dragonText = '';
let nearMissText = '';
let nearMissTimer = 0;
let dragonShadowTimer = 0;

// ① 層演出用
let layerShownIndex  = -1;
let layerBannerTimer = 0;
let layerBannerName  = '';
let layerBannerSub   = '';
let layerBannerColor = '#7df9ff';
let lightningTimer   = 0;

function announceLayer(i) {
    const L = LAYERS[i];
    layerBannerName  = L.name;
    layerBannerSub   = L.sub;
    layerBannerColor = L.color;
    layerBannerTimer = 110;
    sfxLayer();
}

function drawLayerBanner() {
    if (layerBannerTimer <= 0) return;
    layerBannerTimer--;
    const a = layerBannerTimer / 110;
    const fade = a > 0.75 ? (1 - a) / 0.25 : Math.min(1, a / 0.35);

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, fade));
    ctx.textAlign = 'center';

    ctx.font = `bold 34px ${FONT_JP}`;
    ctx.fillStyle   = layerBannerColor;
    ctx.shadowBlur  = 0;
    ctx.shadowColor = layerBannerColor;
    ctx.fillText(layerBannerName, W / 2, H * 0.2);

    ctx.font = `16px 'Zen Antique', serif`;
    ctx.globalAlpha *= 0.8;
    ctx.shadowBlur = 0;
    ctx.fillStyle  = '#ffffff';
    ctx.fillText(layerBannerSub, W / 2, H * 0.2 + 28);

    ctx.strokeStyle = layerBannerColor;
    ctx.lineWidth = 1;
    ctx.globalAlpha *= 0.5;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 90, H * 0.2 + 44);
    ctx.lineTo(W / 2 + 90, H * 0.2 + 44);
    ctx.stroke();
    ctx.restore();
}

function addDragonKi(amount) {
    if (!koi || STATE !== 'PLAYING') return;
    if (koi.dragonMode) return;

    koi.dragonKi = Math.min(CFG.DRAGON_MAX, koi.dragonKi + amount);

    if (koi.dragonKi >= CFG.DRAGON_MAX) {
        activateDragonMode();
    }

    updateDragonHUD();
}

function activateDragonMode() {
    if (!koi || koi.dragonMode) return;

    koi.dragonMode = true;
    koi.dragonTimer = CFG.DRAGON_DURATION;
    koi.dragonKi = CFG.DRAGON_MAX;

    dragonFlash = 1;
    dragonText = distance >= 75 ? '龍門の加護' : '龍気解放';
    dragonTextTimer = 90;

    for (let i = 0; i < 45; i++) {
        particles.push(new Particle(koi.x, koi.y, {
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            r: 3 + Math.random() * 5,
            decay: 0.015,
            color: Math.random() > 0.5 ? '#ffd700' : '#ff8c00',
            glow: true,
            gravity: 0.02
        }));
    }

    try {
        playTone(392, 'sine', 0.25, 0.15);
        setTimeout(() => playTone(523, 'sine', 0.3, 0.16), 90);
        setTimeout(() => playTone(784, 'sine', 0.45, 0.18), 180);
    } catch (e) {}
}

function updateDragonHUD() {
    if (!koi) {
        dragonFill.style.width = '0%';
        return;
    }

    const pct = koi.dragonMode
        ? (koi.dragonTimer / CFG.DRAGON_DURATION) * 100
        : (koi.dragonKi / CFG.DRAGON_MAX) * 100;

    dragonFill.style.width = Math.max(0, Math.min(100, pct)) + '%';

    if (koi.dragonMode) {
        dragonFill.style.background = 'linear-gradient(to right, #ffffff, #ffd700, #ff8c00)';
        dragonFill.style.boxShadow = '0 0 18px rgba(255,215,0,1)';
    } else {
        dragonFill.style.background = 'linear-gradient(to right, #ff8c00, #ffd700, #fff4a3)';
        dragonFill.style.boxShadow = '0 0 12px rgba(255,215,0,.8)';
    }
}

function drawDragonFlash() {
    if (dragonFlash <= 0.01) return;

    ctx.save();
    ctx.globalAlpha = dragonFlash * 0.22;
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W,H));
    g.addColorStop(0, '#fff4a3');
    g.addColorStop(0.4, '#ffd700');
    g.addColorStop(1, 'rgba(255,140,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    dragonFlash *= 0.9;
}

function drawDragonText() {
    if (dragonTextTimer <= 0) return;

    dragonTextTimer--;

    const a = dragonTextTimer / 90;

    ctx.save();
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.textAlign = 'center';
    ctx.font = `bold ${34 + (1 - a) * 20}px ${FONT_JP}`;
    ctx.fillStyle = '#ffd700';
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#ffd700';
    ctx.fillText(dragonText, W / 2, H * 0.32);
    ctx.restore();
}

function drawNearMissText() {
    if (nearMissTimer <= 0) return;

    nearMissTimer--;

    const a = nearMissTimer / 45;

    ctx.save();
    ctx.globalAlpha = Math.min(1, a * 2);
    ctx.textAlign = 'center';
    ctx.font = `bold ${26 + (1 - a) * 12}px ${FONT_JP}`;
    ctx.fillStyle = '#fff8dc';
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#ffd700';
    ctx.fillText(nearMissText, W / 2, H * 0.38);
    ctx.restore();
}

function drawDragon(t) {
    const cx = W/2 + Math.sin(t*0.6)*W*0.25;
    const cy = H/2 + Math.cos(t*0.4)*H*0.15;
    const segs = 15;

    ctx.save();

    // Body segments
    for (let i = segs; i >= 0; i--) {
        const tt   = t - i * 0.1;
        const sx   = W/2 + Math.sin(tt*0.6 + i*0.25)*W*0.25;
        const sy   = H/2 + Math.cos(tt*0.4 + i*0.18)*H*0.15;
        const life = Math.min(1, t * 0.4);
        const r    = (10 - i*0.3) * life;
        if (r <= 0) continue;

        const g = ctx.createRadialGradient(sx,sy,0,sx,sy,r*1.8);
        g.addColorStop(0, `rgba(255,215,0,${0.8*life})`);
        g.addColorStop(0.6,`rgba(255,140,0,${0.5*life})`);
        g.addColorStop(1, `rgba(200,80,0,0)`);
        ctx.fillStyle   = g;
        ctx.shadowBlur  = 18;
        ctx.shadowColor = '#ffd700';
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI*2);
        ctx.fill();
    }

    // Head
    const hx = W/2 + Math.sin(t*0.6)*W*0.25;
    const hy = H/2 + Math.cos(t*0.4)*H*0.15;
    const hs = Math.min(1, t*0.4) * 18;

    ctx.shadowBlur  = 25;
    ctx.shadowColor = '#ffd700';
    ctx.fillStyle   = '#ffd700';
    ctx.beginPath();
    ctx.arc(hx, hy, hs, 0, Math.PI*2);
    ctx.fill();

    // Eyes
    ctx.shadowBlur = 0;
    ctx.fillStyle  = '#ff2200';
    ctx.beginPath(); ctx.arc(hx-6, hy-4, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+6, hy-4, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(hx-5, hy-5, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+7, hy-5, 1.5, 0, Math.PI*2); ctx.fill();

    // Horns
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx-8,hy-hs); ctx.lineTo(hx-15,hy-hs-15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx+8,hy-hs); ctx.lineTo(hx+15,hy-hs-15); ctx.stroke();

    // Whiskers
    ctx.strokeStyle = 'rgba(255,215,0,0.6)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(hx-hs,hy); ctx.bezierCurveTo(hx-hs-15,hy+8,hx-hs-25,hy-3,hx-hs-30,hy+10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx+hs,hy); ctx.bezierCurveTo(hx+hs+15,hy+8,hx+hs+25,hy-3,hx+hs+30,hy+10); ctx.stroke();

    ctx.restore();

    // Golden particles
    if (particles.length < MAX_PARTICLES && frame % 3 === 0) {
        particles.push(new Particle(hx + (Math.random()-0.5)*25, hy + (Math.random()-0.5)*25, {
            vx: (Math.random()-0.5)*3,
            vy: -1.5 - Math.random()*2.5,
            r: 2.5 + Math.random()*3,
            decay: 0.015,
            color: Math.random()>0.5 ? '#ffd700' : '#ff8c00',
            glow: true, gravity: -0.015
        }));
    }
}

/* ════════════════════════════════
   BACKGROUND RENDERING
   ════════════════════════════════ */
function drawBackground() {
    const blend = layerBlend();
    const A = LAYERS[blend.i], B = LAYERS[blend.next], f = blend.f;
    const mix3 = (ha, hb) => {
        const ca = hex2rgb(ha), cb = hex2rgb(hb);
        return [
            (ca[0] + (cb[0] - ca[0]) * f) / 255,
            (ca[1] + (cb[1] - ca[1]) * f) / 255,
            (ca[2] + (cb[2] - ca[2]) * f) / 255
        ];
    };

    const glWater = window.KoiWater && KoiWater.active;
    if (glWater) {
        KoiWater.setPalette(
            mix3(A.bg[0], B.bg[0]),
            mix3(A.bg[1], B.bg[1]),
            mix3(A.bg[2], B.bg[2]),
            CFG.speed
        );
        KoiWater.frame(performance.now() * 0.001, STATE === 'PLAYING', W, H);
        ctx.clearRect(0, 0, W, H);
        KoiWater.drawSpray(ctx, W, H);
    } else {
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0,   mixHex(A.bg[0], B.bg[0], f));
        bg.addColorStop(0.4, mixHex(A.bg[1], B.bg[1], f));
        bg.addColorStop(1,   mixHex(A.bg[2], B.bg[2], f));
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        if (waterLines) {
            waterLines.forEach(wl => { wl.update(); wl.draw(); });
        }
    }

    if (window.KoiPlants) KoiPlants.drawScenery(ctx, W, H, blend, distance);

    // 層の意匠（桜／笹／紅葉／火の粉）
    if (decors) {
        const DL = f > 0.5 ? B : A;
        decors.forEach(d => { d.update(); d.draw(DL); });
    }

    // 雷雲層の稲光
    if (blend.i === LAYERS.length - 1 || (f > 0.5 && blend.next === LAYERS.length - 1)) {
        if (lightningTimer <= 0 && Math.random() < 0.007) lightningTimer = 9;
    }
    if (lightningTimer > 0) {
        lightningTimer--;
        ctx.save();
        ctx.globalAlpha = (lightningTimer / 9) * 0.22;
        ctx.fillStyle = '#e6dcff';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
    }

    // Mist at bottom
    const mistRGB = f > 0.5 ? B.mist : A.mist;
    const mist = ctx.createLinearGradient(0, H*0.75, 0, H);
    mist.addColorStop(0, `rgba(${mistRGB},0)`);
    mist.addColorStop(1, `rgba(${mistRGB},0.1)`);
    ctx.fillStyle = mist;
    ctx.fillRect(0, H*0.75, W, H*0.25);

    // Dragon Gate at top
    const gateAlpha = Math.min(0.7, (distance / CFG.MAX_DIST) * 1.2);
    if (gateAlpha > 0.05) {
        ctx.save();
        ctx.globalAlpha = gateAlpha;
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth   = 2.5;
        ctx.shadowBlur  = 15; ctx.shadowColor = '#ffd700';
        const gw = 100, gh = 50, gx = W/2, gy = 40;
        ctx.beginPath();
        ctx.moveTo(gx-gw, gy+gh); ctx.lineTo(gx-gw, gy);
        ctx.moveTo(gx+gw, gy+gh); ctx.lineTo(gx+gw, gy);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(gx-gw-8, gy); ctx.lineTo(gx+gw+8, gy);
        ctx.stroke();
        ctx.fillStyle   = '#ffd700';
        ctx.font        = `bold ${12 + gateAlpha*6}px ${FONT_JP}`;
        ctx.textAlign   = 'center';
        ctx.shadowBlur  = 12;
        ctx.fillText('龍門', gx, gy - 8);
        ctx.restore();
    }

    if (koi && koi.dragonMode) {
        ctx.save();
        ctx.globalAlpha = 0.12 + Math.sin(frame * 0.12) * 0.04;
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, 'rgba(255,215,0,0.15)');
        g.addColorStop(0.5, 'rgba(255,140,0,0.08)');
        g.addColorStop(1, 'rgba(255,215,0,0.18)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
    }

    if (dragonShadowTimer > 0) {
        dragonShadowTimer--;
        const t = dragonShadowTimer / 22;
        ctx.save();
        ctx.globalAlpha = 0.14 * t;
        const sweep = (1 - t) * (W + 400) - 200;
        ctx.strokeStyle = 'rgba(20, 12, 45, 0.85)';
        ctx.lineWidth = 55;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sweep - 80, H * 0.2);
        ctx.bezierCurveTo(
            sweep + W * 0.15, H * 0.35,
            sweep + W * 0.35, H * 0.08,
            sweep + W * 0.55, H * 0.22
        );
        ctx.stroke();
        ctx.restore();
    }
}

/* ════════════════════════════════
   GAME LIFECYCLE
   ════════════════════════════════ */
function initGame() {
    distance    = 0;
    frame       = 0;
    victoryT    = 0;
    particles   = [];

    if (!koi) koi = new Koi();
    else {
        koi.x = W / 2;
        koi.y = H * 0.78;
        koi.targetX = koi.x;
        koi.energy = 100;
        koi.trail = [];
        koi.dragonKi = 0;
        koi.dragonMode = false;
        koi.dragonTimer = 0;
        koi.haneTimer = 0;
        koi.haneCd = 0;
        koi.haneCombo = 0;
        koi.tilt = 0;
        koi.frameIndex = 0;
        koi.radius = SPRITE.loaded
            ? Math.min(SPRITE.drawW, SPRITE.drawH) * 0.22
            : 16;
    }

    dragonFlash = 0;
    dragonTextTimer = 0;
    dragonText = '';
    nearMissText = '';
    nearMissTimer = 0;
    dragonShadowTimer = 0;
    updateDragonHUD();

    const gap = obstacleMinGap();
    const firstY = -(Math.max(H * 0.34, 220));
    obstacles = [];
    const lanes = [W * 0.2, W * 0.8, W * 0.18];
    for (let i = 0; i < 3; i++) {
        const o = new Obstacle(firstY - i * gap);
        o.x = lanes[i % lanes.length];
        o.baseX = o.x;
        obstacles.push(o);
    }
    bubbles     = Array.from({ length: 3 }, () => new Bubble());
    if (!window.KoiWater || !KoiWater.active) {
        if (!waterLines || waterLines.length !== 14) {
            waterLines  = Array.from({ length: 14 }, () => new WaterLine());
        }
    } else {
        waterLines = waterLines || [];
    }
    if (!decors || decors.length !== 12) {
        decors      = Array.from({ length: 12 }, () => new Decor());
    }

    layerShownIndex  = 0;
    layerBannerTimer = 0;
    lightningTimer   = 0;
    updateHaneBtn();
}

let startArmed = false;
let fontWarmed = false;
function startGame() {
    if (startArmed || STATE === 'PLAYING') return;
    startArmed = true;
    document.body.classList.remove('start-idle');
    startScreen.classList.add('hidden');
    goScreen   .classList.add('hidden');
    vicScreen  .classList.add('hidden');
    requestAnimationFrame(() => {
        unlockWebAudio();
        if (window.KoiWater) KoiWater.startAudio();
        bakeLogSprite();
        initGame();
        requestAnimationFrame(() => {
            STATE = 'PLAYING';
            startArmed = false;
        });
    });
}

function endGame(victory) {
    if (STATE !== 'PLAYING') return;
    STATE = victory ? 'VICTORY' : 'GAMEOVER';
    layerBannerTimer = 0;

    if (koi) {
        koi.haneTimer = 0;
        koi.haneCd = 0;
        koi.dragonMode = false;
        koi.dragonTimer = 0;
        koi.dragonKi = 0;
    }
    dragonFlash = 0;
    dragonTextTimer = 0;
    dragonText = '';
    nearMissTimer = 0;
    nearMissText = '';
    dragonShadowTimer = 0;
    updateDragonHUD();

    const d = Math.floor(distance);
    if (d > bestDistance) persistBestDistance(d);

    if (victory) {
        sfxVictory();
        // Massive golden burst
        for (let i = 0; i < 60; i++) {
            particles.push(new Particle(W/2, H/2, {
                vx: (Math.random()-0.5)*12,
                vy: (Math.random()-0.5)*12,
                r: 3+Math.random()*6,
                decay: 0.008+Math.random()*0.012,
                color: Math.random()>0.5?'#ffd700':'#ff8c00',
                glow: true, gravity: 0.04
            }));
        }
        setTimeout(() => {
            document.getElementById('score-badge-v').textContent = `到達距離：${d} m`;
            vicScreen.classList.remove('hidden');
        }, 3000);
    } else {
        sfxHit();
        spawnBurst(koi.x, koi.y, 25, {
            vx: undefined, vy: undefined,
            r: 3.5, decay: 0.018, color: '#ff4444', glow: true, gravity: 0.08
        });
        setTimeout(() => {
            document.getElementById('score-badge').textContent = `到達距離：${d} m`;
            document.getElementById('go-best').textContent =
                d >= bestDistance ? '🏆 新記録！' : `最高記録：${bestDistance} m`;
            goScreen.classList.remove('hidden');
        }, 1000);
    }
}

/* ════════════════════════════════
   INPUT
   ════════════════════════════════ */
function setTarget(x) {
    if (STATE === 'PLAYING') koi.targetX = x;
}
function pointerClientX(e) {
    return e.clientX;
}
let canvasPointerActive = false;
canvas.addEventListener('pointerdown', e => {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    canvasPointerActive = true;
    unlockWebAudio();
    setTarget(pointerClientX(e));
}, { passive: true });
canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') {
        setTarget(pointerClientX(e));
        return;
    }
    if (canvasPointerActive) setTarget(pointerClientX(e));
}, { passive: false });
['pointerup', 'pointercancel'].forEach(ev => {
    canvas.addEventListener(ev, () => { canvasPointerActive = false; }, { passive: true });
});
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    unlockWebAudio();
    if (STATE === 'PLAYING' && e.touches.length > 0) {
        setTarget(e.touches[0].clientX);
    }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (STATE === 'PLAYING' && e.touches.length > 0) {
        setTarget(e.touches[0].clientX);
    }
}, { passive: false });

// ── ② 跳ね 入力 ──
function doHane() {
    unlockWebAudio();
    if (STATE === 'PLAYING' && koi && koi.tryHane()) {
        if (navigator.vibrate) navigator.vibrate(15);
    }
}
let lastPlayTapAt = 0;
let lastPlayTapX = 0;
let lastPlayTapY = 0;
function isHaneSkipTarget(t) {
    if (!t || !t.closest) return false;
    return !!(t.closest('#hane-btn') || t.closest('#mute-btn') || t.closest('.btn'));
}
function maybeDoubleTapHaneAt(x, y) {
    if (STATE !== 'PLAYING' || !koi) return;
    const now = performance.now();
    const dt = now - lastPlayTapAt;
    const dist = Math.hypot(x - lastPlayTapX, y - lastPlayTapY);
    if (dt > 40 && dt <= 450 && dist < 140) {
        doHane();
        lastPlayTapAt = 0;
        return;
    }
    lastPlayTapAt = now;
    lastPlayTapX = x;
    lastPlayTapY = y;
}
document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    if (isHaneSkipTarget(e.target)) return;
    maybeDoubleTapHaneAt(e.clientX, e.clientY);
}, { passive: true });
window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') {
        e.preventDefault();
        doHane();
    }
});

function updateHaneBtn() {
    if (!koi || STATE !== 'PLAYING') { haneBtn.className = 'cool'; return; }
    const ready = koi.haneCd <= 0 && koi.haneTimer <= 0 &&
                  (koi.dragonMode || koi.energy >= CFG.HANE_COST + 2);
    let cls = ready ? '' : 'cool';
    if (ready && koi.dragonMode) cls = 'free';
    haneBtn.className = cls;
}

/* ════════════════════════════════
   HUD UPDATE
   ════════════════════════════════ */
function updateHUD() {
    distUI.textContent = Math.floor(distance);
    progressFill.style.width = Math.min(100, (distance / CFG.MAX_DIST) * 100) + '%';
    const dl = CFG.diffLabel;
    diffBadge.textContent   = dl.text;
    diffBadge.style.color   = dl.color;
    diffBadge.style.borderColor = dl.color;
    updateHaneBtn();
}

/* ════════════════════════════════
   MAIN LOOP
   ════════════════════════════════ */
function loop() {
    requestAnimationFrame(loop);

    try {
    frame++;

    drawBackground();

    if (STATE === 'PLAYING') {
        distance += 0.04;
        updateHUD();

        // ① 層の切り替わり演出
        const li = layerIndexAt(distance);
        if (li !== layerShownIndex) {
            layerShownIndex = li;
            announceLayer(li);
        }

        if (distance >= CFG.MAX_DIST) { endGame(true); return; }

        // Dynamic obstacle spawning
        if (Math.random() < CFG.spawnRate && obstacles.length < CFG.MAX_OBSTACLES) {
            obstacles.push(new Obstacle());
        }
        while (obstacles.length > CFG.MAX_OBSTACLES) obstacles.shift();

        // Update & draw bubbles
        bubbles.forEach(b => {
            b.update(); b.draw();
            if (b.collidesWith(koi)) {
                koi.energy = Math.min(100, koi.energy + b.energy);

                addDragonKi(b.glow ? CFG.DRAGON_GOLD_BUBBLE : CFG.DRAGON_BUBBLE);

                sfxBubble();

                spawnBurst(b.x, b.y, b.glow ? 16 : 8, {
                    vx: undefined,
                    vy: undefined,
                    r: b.glow ? 3.5 : 2.5,
                    decay: 0.035,
                    color: b.glow ? '#ffd700' : '#7df9ff',
                    glow: true,
                    gravity: -0.04
                });

                if (b.glow) {
                    dragonFlash = Math.max(dragonFlash, 0.35);
                }

                b.reset();
            }
        });

        // Update & draw obstacles
        obstacles.forEach(o => {
            o.update();
            o.draw();

            if (o.collidesWith(koi)) {
                if (koi.dragonMode) {
                    spawnBurst(o.x, o.y, 22, {
                        vx: undefined,
                        vy: undefined,
                        r: 3.5,
                        decay: 0.025,
                        color: '#ffd700',
                        glow: true,
                        gravity: 0.03
                    });

                    dragonFlash = Math.max(dragonFlash, 0.25);

                    try {
                        playTone(180, 'sawtooth', 0.12, 0.08);
                        playTone(520, 'sine', 0.18, 0.12);
                    } catch (e) {}

                    o.init();
                } else if (koi.invincible) {
                    // ② 跳ねで水面ごと蹴り抜ける
                    spawnBurst(o.x, o.y, 18, {
                        vx: undefined,
                        vy: undefined,
                        r: 3,
                        decay: 0.03,
                        color: 'rgba(220,250,255,0.95)',
                        glow: true,
                        gravity: 0.05
                    });
                    koi.haneCombo++;
                    addDragonKi(CFG.HANE_KI);
                    nearMissText = koi.haneCombo >= 2 ? '二段抜け！' : '水面蹴り！';
                    nearMissTimer = 40;
                    try { playTone(700, 'triangle', 0.12, 0.09); } catch (e) {}
                    o.init();
                } else {
                    endGame(false);
                }
            } else if (!koi.dragonMode && !koi.invincible && o.nearMissReady && o.nearMisses(koi)) {
                o.nearMissReady = false;
                koi.energy = Math.min(100, koi.energy + 4);
                addDragonKi(CFG.DRAGON_NEAR_MISS);

                nearMissText = '見切り！';
                nearMissTimer = 45;

                spawnBurst(koi.x, koi.y, 10, {
                    vx: undefined,
                    vy: undefined,
                    r: 2.5,
                    decay: 0.03,
                    color: '#ffd700',
                    glow: true,
                    gravity: -0.03
                });
            }
        });

        koi.update();
        koi.draw();

    } else if (STATE === 'START') {
        bakeLogSprite();
        if (!fontWarmed) {
            ctx.save();
            ctx.globalAlpha = 0.001;
            ctx.font = `bold 34px ${FONT_JP}`;
            ctx.fillText('里の川', -400, -400);
            ctx.restore();
            fontWarmed = true;
        }
    } else if (STATE === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(0, 0, W, H);

    } else if (STATE === 'VICTORY') {
        victoryT += 0.02;
        const vg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));
        vg.addColorStop(0,   `rgba(255,215,0,${Math.min(0.15, victoryT*0.05)})`);
        vg.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = vg;
        ctx.fillRect(0,0,W,H);
        drawDragon(victoryT);
    }

    // Particles (always rendered)
    particles = particles.filter(p => !p.dead);
    particles.forEach(p => { p.update(); p.draw(); });
    limitParticles();

    drawDragonFlash();
    drawLayerBanner();
    drawDragonText();
    drawNearMissText();
    } catch (e) {
        console.warn('Game loop error:', e);
    }
}

// ── Boot ──
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        pauseBGM();
        return;
    }
    unlockWebAudio();
    if (bgmWanted) startBGM();
});
window.addEventListener('pageshow', () => {
    unlockWebAudio();
    if (bgmWanted && !document.hidden) startBGM();
});
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('dblclick', e => {
    e.preventDefault();
    if (STATE === 'PLAYING') doHane();
}, { passive: false });
document.addEventListener('contextmenu', e => { e.preventDefault(); });
let lastIOSQuickTap = 0;
document.addEventListener('touchstart', e => {
    const now = Date.now();
    if (now - lastIOSQuickTap < 300) e.preventDefault();
    lastIOSQuickTap = now;
}, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
    if (e.cancelable && lastTouchEnd && (Date.now() - lastTouchEnd) <= 300) {
        e.preventDefault();
    }
    lastTouchEnd = Date.now();
    if (isHaneSkipTarget(e.target)) return;
    const t = e.changedTouches && e.changedTouches[0];
    if (t) maybeDoubleTapHaneAt(t.clientX, t.clientY);
}, { capture: true, passive: false });
/* iOS Safari: 画面バウンス防止。スクロール領域だけ除外。 */
document.addEventListener('touchmove', e => {
    if (e.target && e.target.closest && e.target.closest('[data-scrollable]')) return;
    if (e.cancelable) e.preventDefault();
}, { passive: false });

initGame();
loop();
</script>
